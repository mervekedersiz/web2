<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            margin:auto;
        }
        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border: 1px solid #ddd;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input,textarea{
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .badge{
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-group button:hover {
            background: #0056b3;
            COLOR:white;
        }
        .btn-submit{
            background: #28a745;
            color:#0056b3
        }
        .btn-clear{
            background-color: #dc3545;
            color: #fff;
        }
        status-msg{
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #28a745;
            font-weight: 600;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge"Otamatik offline kayıt</span>
            <h3>Müşteri Arıza Destek KAYIT FORMU</h3>
            <p style="font-size: 12px; color: #555;">Lütfen tüm alanları eksiksiz doldurunuz.</p>
            
            <form id="supportForm">
                <div class="form-group">
                    <label for="customerName">Müşteri Adı:</label>
                    <input type="text" id="customerName" name="customerName" required>
                    placeholder="şeytan melek">
                </div>
                <div class="form-group">
                    <label for="txtDevice">Cihaz Modeli:</label>
                    <input type="text" name="txtDevice" id="txtDevice" required>
                    placeholder="vişne model ayfon 18">
                </div>
                <div class="form-group">
                    <label for="txtIssue">Arıza Açıklaması:</label>
                    <textarea id="txtIssue" name="desc" rows="4" 
                    placeholder="ekran kırık, şarj olmuyor, wifi bağlanmıyor">
                    </textarea>
                </div>
                <div class="status-msg" id="statusLog"></div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">KAYDET</button>
                    <button type="reset" id="btn-clear" class="btn-clear">TEMİZLE</button>
                </div>


            <script>
                const StroageKey='supportFormData';
                const form = document.getElementById('supportForm');
                const NameInput = document.getElementById('customerName');
                const DeviceInput = document.getElementById('txtDevice');
                const IssueInput = document.getElementById('txtIssue');
                const statusLog = document.getElementById('statusLog');
                const clearButton = document.getElementById('btn-clear');

                //
                
            </script>
            </form>

    
</body>
</html>
