<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech Dashboard</title>

    <style>
        /* CSS RESET + DEĞİŞKENLER */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.65);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 25px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 10px;
        }

        header p {
            color: var(--muted);
        }

        /* ANİMASYON */
        .status {
            margin-top: 15px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.5);
                opacity: 0.4;
            }
        }

        /* MOBILE FIRST - 1 SÜTUN */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        /* GLASSMORPHISM */
        .card {
            background: var(--card);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            min-height: 160px;
            transition: 0.3s;
        }

        /* HOVER */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 16px;
            color: var(--muted);
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
        }

        .up {
            color: var(--success);
        }

        /* SKELETON LOADING */
        .skeleton {
            height: 18px;
            width: 70%;
            border-radius: 6px;
            background: #475569;
            animation: loading 1.2s infinite;
        }

        @keyframes loading {
            50% {
                opacity: 0.3;
            }
        }

        /* TABLET */
        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* MASAÜSTÜ */
        @media (min-width: 1024px) {
            .dashboard {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>FinTech Dashboard</h1>
        <p>Finansal durumunuzu tek ekrandan takip edin.</p>

        <div class="status">
            <span class="dot"></span>
            Sistem Aktif
        </div>
    </header>

    <main class="dashboard">

        <div class="card">
            <h2>Toplam Bakiye</h2>
            <div class="value">₺42.500</div>
            <span class="up">▲ %12.4</span>
        </div>

        <div class="card">
            <h2>Bu Ayki Gelir</h2>
            <div class="value">₺18.750</div>
            <span class="up">▲ %8.2</span>
        </div>

        <div class="card">
            <h2>Harcamalar</h2>
            <div class="value">₺7.320</div>
            <span>Bu ay</span>
        </div>

        <div class="card">
            <h2>Yatırımlar</h2>
            <div class="value">₺25.800</div>
            <span class="up">▲ %5.7</span>
        </div>

        <div class="card">
            <h2>Kredi Durumu</h2>
            <div class="value">₺12.000</div>
            <span>Ödenmemiş</span>
        </div>

        <div class="card">
            <h2>İşlem Verileri</h2>
            <div class="skeleton"></div>
        </div>

    </main>

</body>
</html>
