    const randevuOlustur = (danisanAdi, hizmet, uzmanMusaitMi) => {

                if (uzmanMusaitMi) {
                    const randevuDetay = {
                        takipNo: "Bio-" + Math.floor(1000 + Math.random() * 9000),
                        danisan: danisanAdi,
                        hizmet: hizmet,
                        saat: "14:30",
                        onaylandi: true
                    };
                    resolve(randevuDetay);
                } else {
                    reject("Uzman müsait değil, randevu oluşturulamadı.");
                }
            }, 1500); //1.5 sn sunucu gecikmesi simülasyonu.
        });
    };

const fetchDoktorlar = new Promise(res => setTimeout(() => res(["Dr.Bengünur", "Dr.Ahmet"]), 1200));
const fetchOdaMusaitlik = new Promise(res => setTimeout(() => res(["VIP ODA", "Lazer ODASI"]), 800));
const fetchGunlukKampanyalar = new Promise(res => setTimeout(() => res(["%15 Sonbahar kampanyaı", "2 masaj alana 1 hediye"]), 1000));

const verileriYukle = async () => {
    console.time("paralel yukleme suresi");
    try {
        const [doktorlar, odalar, kampanyalar] = await Promise.all([
            fetchDoktorlar,
            fetchOdaMusaitlik,
            fetchGunlukKampanyalar
        ]);

        console.log("Doktorlar:", doktorlar);
        console.log("Odalar:", odalar);
        console.log("Kampanyalar:", kampanyalar);
    } catch (err) {
        console.error("herhangi bir istek basarisiz olursa hepsi düser", err);
    }
    console.timeEnd("paralel yukleme suresi");
};

verileriYukle();
